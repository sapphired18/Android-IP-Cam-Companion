[package]
name = "ipcam-webcam"
version = "0.1.0"
edition = "2021"
description = "Use the Android IP Camera app as a V4L2 webcam (libadwaita)"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.9" }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde_json = "1"
base64 = "0.22"
regex = "1"
async-channel = "2"

[profile.release]
lto = true
strip = true
